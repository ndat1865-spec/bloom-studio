# path: auth-service/src/main/resources/application.properties
# purpose: cau hinh cong, database va JWT cho auth-service
spring.application.name=auth-service
server.port=8081

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/bloom_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER:root}
# Mat khau doc tu bien moi truong DB_PASSWORD - KHONG bao gio ghi vao file commit len Git
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# QUAN TRONG: phai GIONG HET chuoi o product-service va order-service.
jwt.secret=${JWT_SECRET:Bloom-Studio-Secret-Key-Do-An-Huong-Dich-Vu-2026-Doi-Trong-Thuc-Te}
jwt.expiration-ms=86400000

# Dang nhap bang Google: Client ID (loai Web application) tao o Google Cloud Console.
# De trong = tat tinh nang, nut Google tren trang dang nhap tu an.
google.client-id=${GOOGLE_CLIENT_ID:}
