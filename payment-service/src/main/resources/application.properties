# path: payment-service/src/main/resources/application.properties
# purpose: cau hinh cong, database, dia chi order-service, JWT va ba cong thanh toan
spring.application.name=payment-service
server.port=8084

# createDatabaseIfNotExist: service moi, may cu chua co san CSDL bloom_payment
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/bloom_payment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER:root}
# Mat khau doc tu bien moi truong DB_PASSWORD - KHONG bao gio ghi vao file commit len Git
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Noi hoi so tien that cua don va bao "da thanh toan"
order-service.base-url=${ORDER_SERVICE_URL:http://localhost:8083}

# QUAN TRONG: phai GIONG HET chuoi o auth-service, product-service va order-service.
jwt.secret=${JWT_SECRET:Bloom-Studio-Secret-Key-Do-An-Huong-Dich-Vu-2026-Doi-Trong-Thuc-Te}

# ---------- Chung cho ca ba cong ----------
# Trang cua customer-frontend ma cong thanh toan dua trinh duyet quay ve sau khi tra tien.
payment.return-url=${PAYMENT_RETURN_URL:http://localhost:5173/payment/result}
# Dia chi cong khai cua Gateway, dung ghep link IPN/callback gui cho cong thanh toan.
# Chay tren may ca nhan thi cong thanh toan KHONG goi vao duoc localhost - xem README.
payment.public-base-url=${PAYMENT_PUBLIC_BASE_URL:http://localhost:8080}
# Link thanh toan het han sau chung nay phut. Phai NGAN HON thoi gian order-service tu huy
# don chua thanh toan (order.unpaid-cancel-minutes), neu khong khach co the tra tien cho
# mot don vua bi huy.
payment.expire-minutes=${PAYMENT_EXPIRE_MINUTES:15}

# ---------- VNPay (sandbox.vnpayment.vn) ----------
# De trong -> cong nay bi an khoi trang thanh toan, khong loi.
payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
payment.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}

# ---------- MoMo (test-payment.momo.vn) ----------
payment.momo.partner-code=${MOMO_PARTNER_CODE:}
payment.momo.access-key=${MOMO_ACCESS_KEY:}
payment.momo.secret-key=${MOMO_SECRET_KEY:}
payment.momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn}

# ---------- ZaloPay (sb-openapi.zalopay.vn) ----------
payment.zalopay.app-id=${ZALOPAY_APP_ID:}
payment.zalopay.key1=${ZALOPAY_KEY1:}
payment.zalopay.key2=${ZALOPAY_KEY2:}
payment.zalopay.endpoint=${ZALOPAY_ENDPOINT:https://sb-openapi.zalopay.vn}
