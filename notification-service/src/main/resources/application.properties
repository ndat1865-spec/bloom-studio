# path: notification-service/src/main/resources/application.properties
# purpose: nghe su kien don hang tu RabbitMQ va gui email cho khach / cua hang
spring.application.name=notification-service
server.port=8085

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/bloom_notification?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# QUAN TRONG: phai GIONG HET chuoi o cac service khac.
jwt.secret=${JWT_SECRET:Bloom-Studio-Secret-Key-Do-An-Huong-Dich-Vu-2026-Doi-Trong-Thuc-Te}

# Noi tra email cua khach (email la du lieu cua auth-service)
auth-service.base-url=${AUTH_SERVICE_URL:http://localhost:8081}

# ---------- RabbitMQ ----------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Xu ly loi 3 lan (cach nhau 1s, 2s) roi bo sang hang doi thu chet (DLQ), KHONG dat lai vao
# hang doi chinh - neu khong mot tin hong se bi xu ly lai vo han, chan ca hang doi.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ---------- Email ----------
# Mac dinh tro vao Mailpit (hop thu gia lap, xem thu tai http://localhost:8025) - khong gui
# thu that ra Internet. Muon gui that thi doi sang SMTP that (vi du Gmail + App Password).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

notification.from=${NOTIFICATION_FROM:Bloom Studio <no-reply@bloomstudio.local>}
# Hop thu cua cua hang: nhan thong bao don moi, don da thanh toan, don can hoan tien
notification.shop-email=${NOTIFICATION_SHOP_EMAIL:shop@bloomstudio.local}
# Link "Xem don hang" trong thu gui khach
notification.store-url=${NOTIFICATION_STORE_URL:http://localhost:5173}
# Anh bo hoa trong email: dia chi Gateway ma trinh doc email cua khach mo duoc
notification.media-base-url=${NOTIFICATION_MEDIA_BASE_URL:http://localhost:8080}
