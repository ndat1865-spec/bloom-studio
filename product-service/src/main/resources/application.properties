# path: product-service/src/main/resources/application.properties
# purpose: cau hinh cong, database, upload anh va JWT cho product-service
spring.application.name=product-service
server.port=8082

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/bloom_product?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER:root}
# Mat khau doc tu bien moi truong DB_PASSWORD - KHONG bao gio ghi vao file commit len Git
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Upload anh san pham
# Thu muc luu anh admin upload luc chay. Duong dan tuong doi theo thu muc lam viec
# cua tien trinh, nen dat tuyet doi qua bien UPLOAD_DIR neu muon chac chan.
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Dia chi order-service - de hoi "khach da nhan hang chua" truoc khi cho danh gia.
# Docker Compose doi bien nay sang ten service.
order-service.base-url=${ORDER_SERVICE_URL:http://localhost:8083}

# QUAN TRONG: chuoi bi mat nay phai GIONG HET nhau o auth-service, product-service
# va order-service. Day la diem chung DUY NHAT giua cac service ve bao mat.
# Khi trien khai that phai doc tu bien moi truong, khong de trong file commit len Git.
jwt.secret=${JWT_SECRET:Bloom-Studio-Secret-Key-Do-An-Huong-Dich-Vu-2026-Doi-Trong-Thuc-Te}
