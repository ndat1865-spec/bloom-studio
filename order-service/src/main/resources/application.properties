# path: order-service/src/main/resources/application.properties
# purpose: cau hinh cong, database, dia chi product-service va JWT cho order-service
spring.application.name=order-service
server.port=8083

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/bloom_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER:root}
# Mat khau doc tu bien moi truong DB_PASSWORD - KHONG bao gio ghi vao file commit len Git
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dia chi product-service. Tach rieng ra bien de khi trien khai bang Docker Compose
# chi can doi mot dong sang ten service, khong phai sua code.
product-service.base-url=${PRODUCT_SERVICE_URL:http://localhost:8082}

# QUAN TRONG: phai GIONG HET chuoi o auth-service va product-service.
jwt.secret=${JWT_SECRET:Bloom-Studio-Secret-Key-Do-An-Huong-Dich-Vu-2026-Doi-Trong-Thuc-Te}

# ---------- Thanh toan truc tuyen ----------
# Don chon VNPay / MoMo / ZaloPay ma sau chung nay phut chua thanh toan thi tu huy, tra
# ton kho. Phai LON HON payment.expire-minutes + 10 ben payment-service.
order.unpaid-cancel-minutes=${ORDER_UNPAID_CANCEL_MINUTES:30}

# ---------- Giao Hang Nhanh (GHN) ----------
# Moi truong thu nghiem: https://dev-online-gateway.ghn.vn/shiip/public-api
# That:                  https://online-gateway.ghn.vn/shiip/public-api
# De trong token / shop-id -> dia chi go tu do, phi giao hang co dinh nhu truoc.
ghn.base-url=${GHN_BASE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
ghn.token=${GHN_TOKEN:}
ghn.shop-id=${GHN_SHOP_ID:}
# Moi truong thu cua GHN khong co shipper that nen van don dung mai o "Cho lay hang".
# auto: bat cong cu "Gia lap shipper GHN" o trang quan tri khi base-url la dev-online-gateway.
# true / false: bat / tat han. Moi truong that (online-gateway) thi auto = tat.
ghn.sandbox-simulation=${GHN_SANDBOX_SIMULATION:auto}
# GHN tinh phi theo max(can nang that, the tich quy doi = dai x rong x cao / 5000).
# Truoc day khai thung 40 x 30 x 30 cm -> 7,2 kg cho MOT bo hoa ~1 kg: phi bi day len vo ly.
# Nay: moi bo mot hop hoa 30 x 20 x 15 cm (quy doi 1,8 kg), nang ~800 g; nhieu bo thi hop cao
# them 15 cm moi bo (ShippingService.heightFor).
ghn.item-weight-grams=${GHN_ITEM_WEIGHT_GRAMS:800}
ghn.package-length-cm=30
ghn.package-width-cm=20
ghn.package-height-cm=15

# ---------- RabbitMQ: phat su kien don hang cho notification-service ----------
# RabbitMQ tat thi don hang VAN dat duoc - chi mat thong bao (xem OrderEventPublisher).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Khong de dat hang phai doi lau khi RabbitMQ chet
spring.rabbitmq.connection-timeout=2s

# ---------- Giao hoa tuoi ----------
# Sau gio nay (gio Viet Nam) khong nhan don giao trong ngay nua.
order.same-day-cutoff-hour=${ORDER_SAME_DAY_CUTOFF_HOUR:15}
# Ma tinh GHN duoc giao, cach nhau dau phay (201 = Ha Noi). De trong = giao moi noi.
# Hoa tuoi di buu kien lien tinh 2-3 ngay la heo, nen studio chi giao noi thanh.
order.delivery-province-ids=${ORDER_DELIVERY_PROVINCE_IDS:201}
# Ten vung giao hien cho khach. Mac dinh khai trong DeliveryPolicy (file nay doc theo
# ISO-8859-1, chu co dau se vo) - chi dat bien moi truong khi doi vung giao.
# order.delivery-area-label=${ORDER_DELIVERY_AREA_LABEL}

# ---------- Anh don hang (anh hoa thanh pham, anh mau khach gui) ----------
# Thu muc tren dia; duong dan web luon la /order-media/** (xem MediaStorageService).
order.media.dir=${ORDER_MEDIA_DIR:order-media}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
