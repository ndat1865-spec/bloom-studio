# path: chat-service/src/main/resources/application.properties
# purpose: cong, CSDL, dia chi product-service / order-service, JWT va Claude API cho chat-service
spring.application.name=chat-service
server.port=8086

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/bloom_chat?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER:root}
# Mat khau doc tu bien moi truong DB_PASSWORD - KHONG bao gio ghi vao file commit len Git
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# QUAN TRONG: phai GIONG HET chuoi o cac service con lai.
jwt.secret=${JWT_SECRET:Bloom-Studio-Secret-Key-Do-An-Huong-Dich-Vu-2026-Doi-Trong-Thuc-Te}

# Tro ly AI doc du lieu that qua API cua hai service nay (khong doc CSDL cua ho)
product-service.base-url=${PRODUCT_SERVICE_URL:http://localhost:8082}
order-service.base-url=${ORDER_SERVICE_URL:http://localhost:8083}

# ---------- Claude API ----------
# De trong -> tat tro ly AI: moi cuoc chat vao thang hang cho nhan vien.
# KHONG ghi khoa vao file nay; dat bien moi truong ANTHROPIC_API_KEY (hoac .env cua Docker).
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-opus-5-5}
# low: tra loi chat nhanh, tieu it token; tang len medium neu tu van chua du ky.
anthropic.effort=${ANTHROPIC_EFFORT:low}
# Moi cuoc chat AI tra loi toi da ngan nay cau, qua thi chuyen nhan vien (chan chi phi khi bi spam)
chat.ai-max-replies=${CHAT_AI_MAX_REPLIES:30}
